lexik_jwt_authentication:
    secret_key: '%kernel.project_dir%/config/jwt/private.pem' # Chemin vers la clé privée
    public_key: '%kernel.project_dir%/config/jwt/public.pem' # Chemin vers la clé publique
    pass_phrase: '' # Passphrase utilisée lors de la génération des clés (laisser vide si non utilisée)
    token_ttl: 3600 # Durée de vie du token (en secondes, ici 1 heure)

    # Le jeton d'accès est délivré dans un cookie httpOnly : il n'est plus lisible
    # par JavaScript (mitigation XSS). L'extracteur Authorization reste actif pour
    # l'outillage (tests API, curl).
    token_extractors:
        authorization_header:
            enabled: true
            prefix: Bearer
            name: Authorization
        cookie:
            enabled: true
            name: jwt_token
    set_cookies:
        jwt_token:
            samesite: none # front et API sur des origines différentes (ports en dev) ; CSRF couvert par le préflight CORS (API JSON)
            path: /
            domain: null
            secure: true
            httpOnly: true
    # Le corps de réponse conserve le token pour l'outillage ; le front l'ignore
    # (il n'est jamais stocké côté client).
    remove_token_from_body_when_cookies_used: false
