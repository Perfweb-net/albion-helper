nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization', 'X-Albion-Server']
        expose_headers: []
        max_age: 3600
        # Requis pour les cookies httpOnly d'authentification : les origines restent
        # une liste fermée (origin_regex ci-dessus), jamais de wildcard avec credentials.
        allow_credentials: true
    paths:
        '^/api/': ~
